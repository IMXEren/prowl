name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -W error -p no:cacheprovider

      - name: Build source artifacts
        run: uv run python -m build

      - name: Audit source artifacts
        run: uv run python .github/scripts/audit_artifacts.py dist --expect-version "$(uv run python -c 'from prowl.__about__ import __version__; print(__version__)')"

  release:
    name: Publish GitHub release and prepare image metadata
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Release to GitHub and prepare image metadata
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}

      - name: Upload the released image descriptor
        if: ${{ always() && hashFiles('release-image.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-image
          path: release-image.json
          if-no-files-found: ignore

  images:
    name: Build native ${{ matrix.arch }} image
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the released image descriptor
        uses: actions/download-artifact@v4
        with:
          name: release-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test the native candidate
        env:
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
          PROWL_FONT_GITHUB_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
        run: bash .github/scripts/build-platform-image.sh "${{ matrix.arch }}"

      - name: Upload the verified platform digest
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.digest
          if-no-files-found: error

  publish-image:
    name: Publish multi-platform image tags
    needs: [release, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@v7

      - name: Download the released image descriptor
        uses: actions/download-artifact@v4
        with:
          name: release-image

      - name: Download the verified platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-platform tags and retain releases
        env:
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
        run: bash .github/scripts/publish-image-index.sh
