name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -W error -p no:cacheprovider

      - name: Build source artifacts
        run: uv run python -m build

      - name: Audit source artifacts
        run: uv run python .github/scripts/audit_artifacts.py dist --expect-version "$(uv run python -c 'from prowl.__about__ import __version__; print(__version__)')"

  release:
    name: Publish GitHub release and prepare amd64 image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Release to GitHub and prepare the GHCR candidate
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
          PROWL_FONT_GITHUB_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}

      - name: Upload the released image descriptor
        if: ${{ always() && hashFiles('release-image.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: release-image.json
          if-no-files-found: ignore

  image-arm64:
    name: Build arm64 and publish multi-platform tags
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the released image descriptor
        uses: actions/download-artifact@v4
        with:
          name: release-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test the native arm64 candidate
        env:
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
          PROWL_FONT_GITHUB_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
        run: bash .github/scripts/build-arm64-image.sh

      - name: Publish multi-platform tags and retain releases
        env:
          PROWL_GHCR_TOKEN: ${{ secrets.SECRET_GITHUB_PAT }}
        run: bash .github/scripts/publish-image-index.sh
