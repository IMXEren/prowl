name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -W error -p no:cacheprovider

      - name: Build source artifacts
        run: uv run python -m build

      - name: Audit source artifacts
        run: uv run python .github/scripts/audit_artifacts.py dist --expect-version "$(uv run python -c 'from prowl.__about__ import __version__; print(__version__)')"

      - name: Fetch private fingerprint fonts
        if: github.repository == 'IMXEren/prowl'
        uses: actions/checkout@v7
        with:
          repository: IMXEren/extra-fonts
          token: ${{ secrets.SECRET_GITHUB_PAT }}
          lfs: true
          path: .private-fonts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image with fingerprint fonts
        if: github.repository == 'IMXEren/prowl'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            windows_fonts=.private-fonts
          load: true
          push: false
          tags: prowl:ci

      - name: Build local image without private fonts
        if: github.repository != 'IMXEren/prowl'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: prowl:ci

      - name: Smoke-test local image
        run: docker run --rm --entrypoint python prowl:ci -c "import prowl"

      - name: Verify private fonts were installed
        if: github.repository == 'IMXEren/prowl'
        run: docker run --rm --entrypoint sh prowl:ci -c 'test -n "$(find /usr/share/fonts/windows -type f -print -quit)"'

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize Python dependencies
        run: uv sync --all-extras --locked

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Release to GitHub
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
