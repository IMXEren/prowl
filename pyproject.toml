[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prowl"
dynamic = ["version"]
description = "Reusable browser automation core, FlareSolverr-compatible HTTP service, and CLI for browser-backed fetches."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "loguru==0.7.3",
    "cloakbrowser[geoip]==0.5.8",
    "curl_cffi==0.16.1",
    "pydoll-python @ git+https://github.com/IMXEren/pydoll.git@2.24.1",
    "requests==2.34.2",
    "turbohtml==1.6.1",
    "pycryptodome==3.23.0",
    "aiohttp==3.13.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "build>=1.2",
]

[project.scripts]
prowl = "prowl.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prowl"]

[tool.hatch.version]
path = "src/prowl/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/prowl", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D401",
    "ANN401",
    "S603",
    "S607",
    "ARG002",
    "PTH122",
    "TRY301",
    "PERF203",
    "UP004",
    "PLR0911",
    "S310",
    "CPY",
    "COM812",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
".github/scripts/**" = ["T201"]
"tests/**" = ["D", "S101", "PT009", "PT027", "SLF001", "PLR2004", "ARG005", "C901", "N806", "ASYNC109"]
"src/prowl/browser/rwlock.py" = ["PGH004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
